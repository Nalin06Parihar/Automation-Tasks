[project]
name = "pptautomation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-pptx>=1.0.2",
    "streamlit>=1.65.0",
]

[project.optional-dependencies]
windows-com = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
pptautomation = "pptautomation.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
