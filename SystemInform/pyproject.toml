[project]
name = "systeminform"
version = "0.1.0"
description = "Cross-platform system details utility for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
systeminform = "systeminform:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
